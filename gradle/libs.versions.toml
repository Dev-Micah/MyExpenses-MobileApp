[versions]
agp = "9.1.1"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.3.20"
composeBom = "2026.03.01"
appcompat = "1.7.1"
material = "1.13.0"
googleFontCompose = "1.9.3"
koin = "4.1.1"
ktor = "2.3.2"
kotlinXSerialization = "1.7.1"
nav3Core = "1.1.0"
lifecycleViewmodelNav3 = "2.11.0-alpha03"
